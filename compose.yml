services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    env_file:
      - path: .env
        required: false
    command: bash -lc "{ bundle check || bundle install; } && bin/rails db:prepare && bin/rails tailwindcss:build && bin/rails server -b 0.0.0.0"
    environment:
      DATABASE_HOST: ${DATABASE_HOST:-db}
      DATABASE_PORT: ${DATABASE_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      RAILS_ENV: ${RAILS_ENV:-development}
    ports:
      - "3000:3000"
    volumes:
      - .:/rails
      - bundle:/usr/local/bundle
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    ports:
      - "5438:5432"
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: igle_org_development
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  bundle:
  postgres:
